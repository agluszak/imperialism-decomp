name: Export PR 794 workspace

on:
  push:
    branches:
      - cursor/strategic-army-navy-reports-950e

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export merge workspace
        run: |
          git fetch origin main
          tar -czf /tmp/pr794-workspace.tar.gz .git rust fixtures decomp/tests/runtime/native
      - uses: actions/upload-artifact@v4
        with:
          name: pr794-workspace
          path: /tmp/pr794-workspace.tar.gz
          retention-days: 1
          compression-level: 0
