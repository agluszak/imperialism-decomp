name: CI

# Source-model enforcement needs no original binary, Wine runtime, or Ghidra. The
# clang-lint job uses the public toolchain Docker image; binary-dependent checks
# (retail build, vtable, datacmp, decomplint, compare/stats) remain local-loop and
# reviewer responsibilities. CI never trusts the agent-task receipt.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  clang-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: astral-sh/setup-uv@v5

      - uses: extractions/setup-just@v2

      - name: Sync Python tooling
        run: uv sync

      - name: Build the public MSVC500/clang-cl toolchain image
        run: just docker-build

      - name: Warning-free clang-cl gate
        run: just lint-warning-gate

      - name: Verify a warning is rejected
        run: just lint-warning-gate-test

  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: astral-sh/setup-uv@v5

      - uses: extractions/setup-just@v2

      - name: Sync Python tooling
        run: uv sync

      - name: Tooling unit tests
        run: just test

      - name: Source-only policy gates
        run: just source-gates

      - name: Generated-artifact integrity vs merge base
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet
          base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          just generated-integrity-gate --no-worktree --base "$base"

  # This job deliberately runs only on a repository-owned, asset-provisioned
  # runner. Never attach the imperialism-runtime label to a general-purpose or
  # fork-PR runner: pull-request code can read every file available to it.
  runtime-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, imperialism-runtime]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify runner-local retail asset
        run: |
          test -n "$ORIGINAL_BINARY"
          test -f "$ORIGINAL_BINARY"

      - name: Sync Python tooling
        run: uv sync --frozen

      - name: Run required native runtime PR suite
        run: just runtime-check pr --jobs 1 --junit build-runtime-tests/runtime-pr.xml
