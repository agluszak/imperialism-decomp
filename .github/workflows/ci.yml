name: CI

# Source-model enforcement needs no original binary, Wine runtime, or Ghidra. The
# clang-lint job uses the public toolchain Docker image; binary-dependent checks
# (retail build, vtable, datacmp, decomplint, compare/stats) remain local-loop and
# reviewer responsibilities. CI never trusts the agent-task receipt.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  clang-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: astral-sh/setup-uv@v5

      - uses: extractions/setup-just@v2

      - name: Sync Python tooling
        run: uv sync

      - name: Build the public MSVC500/clang-cl toolchain image
        run: just docker-build

      - name: Warning-free clang-cl gate
        run: just lint-warning-gate

      - name: Verify a warning is rejected
        run: just lint-warning-gate-test

  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: astral-sh/setup-uv@v5

      - uses: extractions/setup-just@v2

      - name: Sync Python tooling
        run: uv sync

      - name: Tooling unit tests
        run: just test

      - name: Source-only policy gates
        run: just source-gates

      - name: Generated-artifact integrity vs merge base
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet
          base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          just generated-integrity-gate --no-worktree --base "$base"

  # Policy baselines (ratchet files that bless architectural debt) may only
  # change on PRs a human has explicitly labeled `policy-baseline-approved`.
  # This is the CI half of the local ALLOW_POLICY_BASELINE_UPDATE=1 guard.
  policy-baseline-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Reject resurrected hard-ban baselines
        run: |
          # These six gates were converted to baseline-free HARD BANS (their debt
          # was fully eradicated): construction/antipattern, raw-vtable, dual-use,
          # ilt-ossification, boundary, vtable-abi. Re-adding a baseline file is a
          # backdoor to blessing the debt again, so it is forbidden outright.
          banned="config/baselines/construction_gate_baseline.csv
          config/baselines/vtable_gate_baseline.csv
          config/baselines/dual_use_baseline.csv
          config/baselines/ilt_ossification_baseline.csv
          config/baselines/boundary_baseline.json
          config/baselines/vtable_abi_gate_baseline.csv"
          resurrected=""
          for f in $banned; do
            [ -e "$f" ] && resurrected="$resurrected $f"
          done
          if [ -n "$resurrected" ]; then
            echo "Hard-ban gates must not have a baseline file:$resurrected"
            echo "These gates fail on ANY hit; fix the source instead of baselining it."
            exit 1
          fi
          echo "Hard-ban baseline check OK (none resurrected)."

      - name: Require approval label for policy-baseline changes
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet
          base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          # Baselines live under config/baselines/ (the old per-file list had
          # gone stale and guarded nothing). Pure shrinks — the ratchet working
          # as designed — pass without the label; only growth needs approval.
          # Reccmp progress snapshots contain commit/timestamp metadata and are
          # validated by the stats/generated-artifact gates, not this debt ratchet.
          changed="$(git diff --name-only "$base" -- config/baselines/ | grep -v '^config/baselines/reccmp_progress_baseline' || true)"
          grown=""
          for f in $changed; do
            git show "$base:$f" > /tmp/baseline_old 2>/dev/null || : > /tmp/baseline_old
            if ! uv run python -m tools.workflow.baseline_guard --check-shrink /tmp/baseline_old "$f" >/dev/null; then
              grown="$grown $f"
            fi
          done
          if [ -n "$grown" ] && ! printf '%s\n' $LABELS | grep -qx 'policy-baseline-approved'; then
            echo "Policy baselines GREW without the 'policy-baseline-approved' label:$grown"
            echo "A human must approve debt-growing rewrites (AGENTS.md: ALLOW_POLICY_BASELINE_UPDATE)."
            exit 1
          fi
          echo "Policy-baseline guard OK (changed:${changed:-<none>}; grown:${grown:-<none>})."
