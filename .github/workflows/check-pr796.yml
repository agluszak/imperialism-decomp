name: Check PR 796

on:
  push:
    branches:
      - agent/complete-retail-media

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media and Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-libav \
            ffmpeg
      - name: Format
        working-directory: rust
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if ! git diff --quiet -- rust; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add rust
            git commit -m "Format PR 796"
            git push
          fi
      - name: Clippy
        id: clippy
        working-directory: rust
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee ../clippy-pr796.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Clippy diagnostics
        if: steps.clippy.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: clippy-pr796
          path: clippy-pr796.log
      - name: Require Clippy success
        if: steps.clippy.outputs.status != '0'
        run: exit 1
      - name: Test
        working-directory: rust
        run: cargo test --workspace
