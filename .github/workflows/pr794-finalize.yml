name: Finalize PR 794

on:
  push:
    branches: [agent/pr794-export-main3]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct resolved patch
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            .pr794/patch.00 \
            .pr794/patch.01 \
            .pr794/bridge \
            .pr794/c03 \
            .pr794/c04 \
            .pr794/c05 \
            .pr794/c06 \
            .pr794/c07 \
            .pr794/c08 \
            .pr794/c09 \
            .pr794/c10 \
            .pr794/c11 \
            .pr794/c12 > /tmp/pr794.b64
          test "$(wc -c < /tmp/pr794.b64)" -eq 73320
          echo 'f8f8b3172acae81a19ea53911ca370b136248abf847559bb4a375ce8d35bc150  /tmp/pr794.b64' | sha256sum -c -
          base64 -d /tmp/pr794.b64 > /tmp/pr794.patch.gz
          echo '066336c389965ac760dbf08a510ee2cd8a5c4a22b9c753ed27da4da0f9c28a76  /tmp/pr794.patch.gz' | sha256sum -c -
          gzip -dc /tmp/pr794.patch.gz > /tmp/pr794.patch
          echo '80f4ac3478cc742e6a54850f912db5bc17cbbfd3ff489d39ffb426cf73f81d85  /tmp/pr794.patch' | sha256sum -c -

      - name: Apply to latest main
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main cursor/strategic-army-navy-reports-950e
          git checkout -B pr794-final origin/main
          git apply --3way /tmp/pr794.patch
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Validate Rust workspace
        working-directory: rust
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace

      - name: Publish rebased PR branch
        shell: bash
        run: |
          set -euxo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git commit -m 'Port strategic army/navy commands and turn-tail UI'
          git push --force origin HEAD:cursor/strategic-army-navy-reports-950e
