name: Finalize PR 794

on:
  push:
    branches: [agent/pr794-export-main3]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct resolved patch
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            .pr794/patch.00 \
            .pr794/patch.01 \
            .pr794/bridge \
            .pr794/c03 \
            .pr794/c04 \
            .pr794/c05 \
            .pr794/c06 \
            .pr794/c07 \
            .pr794/c08 \
            .pr794/c09 \
            .pr794/c10 \
            .pr794/c11 \
            .pr794/c12 > /tmp/pr794.b64
          test "$(wc -c < /tmp/pr794.b64)" -eq 73320
          echo 'f8f8b3172acae81a19ea53911ca370b136248abf847559bb4a375ce8d35bc150  /tmp/pr794.b64' | sha256sum -c -
          base64 -d /tmp/pr794.b64 > /tmp/pr794.patch.gz
          echo '066336c389965ac760dbf08a510ee2cd8a5c4a22b9c753ed27da4da0f9c28a76  /tmp/pr794.patch.gz' | sha256sum -c -
          gzip -dc /tmp/pr794.patch.gz > /tmp/pr794.patch
          echo '80f4ac3478cc742e6a54850f912db5bc17cbbfd3ff489d39ffb426cf73f81d85  /tmp/pr794.patch' | sha256sum -c -

      - name: Apply to latest main
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main cursor/strategic-army-navy-reports-950e
          git checkout -B pr794-final origin/main
          if ! git apply --3way /tmp/pr794.patch; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              rust/crates/imperialism-app/src/ui/session.rs
              rust/crates/imperialism-core/src/turn_flow.rs
            )
            test "${#conflicts[@]}" -eq "${#expected[@]}"
            for i in "${!expected[@]}"; do
              test "${conflicts[$i]}" = "${expected[$i]}"
            done
            git checkout --theirs -- "${expected[@]}"
            git add -- "${expected[@]}"
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Normalize post-rebase Rust APIs and idioms
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rewrite(path, f):
              p = Path(path)
              p.write_text(f(p.read_text()))

          rewrite(
              'rust/crates/imperialism-core/tests/native_military.rs',
              lambda text: text.replace(
                  'task_force_toolbar_counts(0.into())',
                  'task_force_toolbar_counts(TaskForceIndex::new(0))',
              ),
          )

          def army(text):
              pattern = re.compile(
                  r'if self\.nations\.common\(nation\)\.is_some\(\) \{\s*'
                  r'if let Some\(home\) = self\.nations\.home_tile\(nation\)\s*'
                  r'&& self\.map\[home\]\.province == Some\(province\)\s*\{\s*'
                  r'counts\.can_upgrade = true;\s*\}\s*\}'
              )
              replacement = '''if self.nations.common(nation).is_some()
                  && let Some(home) = self.nations.home_tile(nation)
                  && self.map[home].province == Some(province)
              {
                  counts.can_upgrade = true;
              }'''
              return pattern.sub(replacement, text, count=1)
          rewrite('rust/crates/imperialism-core/src/army_orders.rs', army)

          rewrite(
              'rust/crates/imperialism-core/src/navy_orders/player.rs',
              lambda text: text.replace(
                  'usize::try_from(zone.get()).unwrap_or(usize::MAX)',
                  'usize::from(zone.get())',
              ),
          )

          def game_score(text):
              old = '''let industry = CityFacilitySlot::ALL
              .iter()
              .take(6)
              .map(|&slot| i32::from(major.city.production_orders[slot]))
              .sum();'''
              new = '''let industry = [
              CityFacilitySlot::TextileMill,
              CityFacilitySlot::ClothingFactory,
              CityFacilitySlot::SteelMill,
              CityFacilitySlot::Metalworks,
              CityFacilitySlot::LumberMill,
              CityFacilitySlot::FurnitureFactory,
          ]
          .into_iter()
          .map(|slot| i32::from(major.city.production_orders[slot]))
          .sum();'''
              if old not in text:
                  raise SystemExit('game_score facility block not found')
              return text.replace(old, new, 1)
          rewrite('rust/crates/imperialism-core/src/game_score.rs', game_score)

          rewrite(
              'rust/crates/imperialism-core/src/territory.rs',
              lambda text: text.replace(
                  'let Nations { majors, minors } = &mut self.nations;',
                  'let Nations { majors, minors, .. } = &mut self.nations;',
              ),
          )

          def turn_flow(text):
              text = text.replace(
                  'pub fn close_post_combat_reports(&mut self) -> TurnStop {',
                  'pub fn close_post_combat_reports(&mut self, story_ids: &[i32]) -> TurnStop {',
                  1,
              )
              text = text.replace(
                  'pub fn close_council_of_governors(&mut self) -> TurnStop {',
                  'pub fn close_council_of_governors(&mut self, story_ids: &[i32]) -> TurnStop {',
                  1,
              )
              # These are the only two zero-argument advance_turn calls introduced by PR 794.
              text = text.replace('self.advance_turn()', 'self.advance_turn(story_ids)')
              return text
          rewrite('rust/crates/imperialism-core/src/turn_flow.rs', turn_flow)

          def battle_reports(text):
              if 'use crate::RetailAssetsResource;' not in text:
                  text = text.replace('use crate::AppState;', 'use crate::{AppState, RetailAssetsResource};', 1)
              text = text.replace(
                  'mut session: ResMut<GameSession>,\n    mut selected: ResMut<SelectedBattleReport>,',
                  'mut session: ResMut<GameSession>,\n    assets: Res<RetailAssetsResource>,\n    mut selected: ResMut<SelectedBattleReport>,',
                  1,
              )
              text = text.replace(
                  'session.game.close_post_combat_reports()',
                  'session.game.close_post_combat_reports(assets.news_story_ids())',
                  1,
              )
              return text
          rewrite('rust/crates/imperialism-app/src/ui/battle_reports.rs', battle_reports)

          def endgame(text):
              text = text.replace(
                  'mut session: ResMut<GameSession>,\n    mut next_state: ResMut<NextState<AppState>>,\n) {\n    if actions.get(activate.entity).is_err() {\n        return;\n    }\n    apply_turn_stop(session.game.close_council_of_governors(), &mut next_state);',
                  'mut session: ResMut<GameSession>,\n    assets: Res<RetailAssetsResource>,\n    mut next_state: ResMut<NextState<AppState>>,\n) {\n    if actions.get(activate.entity).is_err() {\n        return;\n    }\n    apply_turn_stop(\n        session.game.close_council_of_governors(assets.news_story_ids()),\n        &mut next_state,\n    );',
                  1,
              )
              return text
          rewrite('rust/crates/imperialism-app/src/ui/endgame.rs', endgame)
          PY

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Validate Rust workspace
        working-directory: rust
        shell: bash
        run: |
          set -o pipefail
          {
            set -x
            cargo fmt --all
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace
          } 2>&1 | tee /tmp/pr794-validation.log

      - name: Upload validation transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr794-validation-log
          path: /tmp/pr794-validation.log
          retention-days: 1

      - name: Publish rebased PR branch
        shell: bash
        run: |
          set -euxo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git commit -m 'Port strategic army/navy commands and turn-tail UI'
          git push --force origin HEAD:cursor/strategic-army-navy-reports-950e
