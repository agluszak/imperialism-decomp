format_version: 2
name: load_save_to_map
native_test: load_saved_game
action_id: combined_map.enter

start:
  fixture: beginning_of_game.imp
  defer_shell_command_until:
    owner_address: "0x00412dc0"
    after_call_to: "0x00415760"
    after_probe:
      probe: turn_event.dispatch
      field: event
      equals: 0x11f8
    rewrite_event:
      action_id: opening_cinematic.skip_to_main_menu
      probe: turn_event.dispatch
      field: event
      from: 0x11f8
      to: 0x05dc
      expression: "*(short*)($esp+4)"

probes:
  - id: turn_event.dispatch
    original_address: 0x005d7240
    capture:
      event:
        expression: "*(short*)($esp+4)"
        normalize: u16
      payload:
        expression: "*(int*)($esp+8)"
        normalize: u32

stop:
  probe: turn_event.dispatch
  field: event
  equals: 0x07dd
  checkpoint_id: combined_map.ready
  capture:
    turn_event:
      expression: "*(short*)(*(unsigned int*)0x006a21bc + 4)"
      normalize: u16
    combined_map_view_present:
      expression: "*(unsigned int*)(*(unsigned int*)0x006a21bc + 0xf0)"
      normalize: bool
    active_nation:
      expression: "*(short*)(*(unsigned int*)0x006a20f8 + 0x2e)"
      normalize: s16
    economic_turn:
      expression: "*(short*)(*(unsigned int*)0x006a20f8 + 0x2c)"
      normalize: s16
    map_present:
      expression: "*(unsigned int*)0x006a43d4"
      normalize: bool
    map_wrap:
      expression: "*(char*)(*(unsigned int*)0x006a43d4 + 0x20)"
      normalize: int
    city_present:
      expression: "*(unsigned int*)(*(unsigned int*)(0x006a4370 + (*(short*)(*(unsigned int*)0x006a20f8 + 0x2e))*4) + 0x894)"
