# Explicit semantic differences between the Mac resource class name and the
# Windows source model. These are not ABI claims; each substitution must remain
# represented by tools.ui_codegen.CLASS_ALIASES.
class_substitutions:
  TBookView:
    windows_class: TBook
    reason: The Windows port uses the shared TBook pager for the price-history shell instead of the resource-only Mac class name.
    evidence: Minister.rsrc:8990 DLOG has the TBook serialized pict shape and lcor/rcor children; TBook is present in Windows RTTI while TBookView is absent from both code symbol corpora
  TDefenseNotesView:
    windows_class: TBook
    reason: The Windows port uses the shared TBook pager for the defense-notes shell instead of the resource-only Mac class name.
    evidence: Minister.rsrc:9610 DLOG has the TBook serialized pict shape and lcor/rcor children; Windows requests event 0x258a and has TBook RTTI but no TDefenseNotesView RTTI
  TExportsView:
    windows_class: TBook
    reason: The Windows port uses the shared TBook pager for the exports shell instead of the resource-only Mac class name.
    evidence: Minister.rsrc:8960 DLOG has the TBook serialized pict shape and lcor/rcor children; Windows requests event 0x2300 and has TBook RTTI but no TExportsView RTTI
  TForeignNotesView:
    windows_class: TBook
    reason: The Windows port uses the shared TBook pager for the foreign-notes shell instead of the resource-only Mac class name.
    evidence: Minister.rsrc:8930 DLOG has the TBook serialized pict shape and lcor/rcor children; Windows requests event 0x22e2 and has TBook RTTI but no TForeignNotesView RTTI
  TInteriorNotesView:
    windows_class: TBook
    reason: The Windows port uses the shared TBook pager for the interior-notes shell instead of the resource-only Mac class name.
    evidence: Minister.rsrc:9710 DLOG has the TBook serialized pict shape and lcor/rcor children; Windows requests event 0x25ee and has TBook RTTI but no TInteriorNotesView RTTI
  TMerchantMarineView:
    windows_class: TBook
    reason: The Windows port uses the shared TBook pager for the merchant-marine shell instead of the resource-only Mac class name.
    evidence: Minister.rsrc:8940 DLOG has the TBook serialized pict shape and lcor/rcor children; Windows requests event 0x22ec and has TBook RTTI but no TMerchantMarineView RTTI
  TMiniDealBookView:
    windows_class: TBook
    reason: The Windows port uses the shared TBook pager for the mini-deal shell instead of the resource-only Mac class name.
    evidence: Minister.rsrc:8950 DLOG has the TBook serialized pict shape and lcor/rcor children; Windows requests event 0x22f6 and has TBook RTTI but no TMiniDealBookView RTTI
  TToolbarCluster:
    windows_class: TToolBarCluster
    reason: Windows source and RTTI use the internal-capital spelling for the toolbar cluster class.
    evidence: FlagView.rsrc:8800 node tbr2; Windows TToolBarCluster source/RTTI identity
  TTreasuriesView:
    windows_class: TBook
    reason: The Windows port uses the shared TBook pager for the treasuries shell instead of the resource-only Mac class name.
    evidence: Minister.rsrc:9720 DLOG has the TBook serialized pict shape and lcor/rcor children; Windows requests event 0x25f8 and has TBook RTTI but no TTreasuriesView RTTI
  TMyWindow:
    windows_class: TWindow
    reason: Mac utility resources use a local window subclass absent from the Windows source model.
    evidence: Linger.rsrc:1000 root WIND; Windows RTTI has TWindow and no TMyWindow

