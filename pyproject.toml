[project]
name = "imperialism-decomp"
version = "0.1.0"
description = "Imperialism (1997) decompilation tooling"
requires-python = ">=3.11"
dependencies = [
    "pyghidra==3.1.0",
    "clang-format==21.1.8",
    "reccmp @ git+https://github.com/agluszak/reccmp.git@9994a2c0ebf3e8a8f7f491fa71be49cc54a527c8",
    "ghidra-stubs>=12.1.2",
    "cxxheaderparser>=1.8.1",
    "pcpp>=1.30",
    "pyyaml>=6.0.3",
    "capstone>=5.0.7",
    "tree-sitter>=0.26.0",
    "tree-sitter-cpp>=0.23.4",
    "pygdbmi==0.11.0.0",
    "pillow>=11.3.0",
    "python-xlib>=0.33",
]

[tool.uv]
package = false
