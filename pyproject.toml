[project]
name = "imperialism-decomp"
version = "0.1.0"
description = "Imperialism (1997) decompilation tooling"
requires-python = ">=3.11"
dependencies = [
    "pyghidra==3.1.0",
    "clang-format==21.1.8",
    "reccmp @ git+https://github.com/agluszak/reccmp.git@1396ceed41304bac95024e0cacdcf63a5c8ab6a3",
    "ghidra-stubs>=12.1.2",
    "cxxheaderparser>=1.8.1",
    "pcpp>=1.30",
    "pyyaml>=6.0.3",
    "capstone>=5.0.7",
    "tree-sitter>=0.26.0",
    "tree-sitter-cpp>=0.23.4",
]

[tool.uv]
package = false
