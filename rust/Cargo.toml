[workspace]
members = [
    "crates/imperialism-app",
    "crates/imperialism-core",
    "crates/imperialism-formats",
    "crates/imperialism-testkit",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
bevy = { version = "=0.19.0", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_winit",
    "multi_threaded",
    "std",
    "x11",
] }
clap = { version = "4", features = ["derive"] }
enum-map = { version = "2.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
