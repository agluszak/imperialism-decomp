[workspace]
members = [
    "crates/imperialism-app",
    "crates/imperialism-core",
    "crates/imperialism-formats",
    "crates/imperialism-testkit",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
bevy = { version = "0.19", default-features = false, features = [
    # Prefer official collections over hand-picking every crate, but omit
    # default_platform extras (wayland/gilrs/udev) we do not need here.
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "bevy_clipboard",
    "x11",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "scene",
    "picking",
    "custom_cursor",
    "2d_bevy_render",
    "bmp",
    "bevy_audio",
    "wav",
    "vorbis",
    "dynamic_linking",
    "debug"
] }
clap = { version = "4", features = ["derive"] }
enum-map = { version = "3", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
pelite = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2.10"
thiserror = "2"
