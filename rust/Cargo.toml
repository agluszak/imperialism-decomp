[workspace]
members = [
    "crates/imperialism-app",
    "crates/imperialism-core",
    "crates/imperialism-formats",
    "crates/imperialism-testkit",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
bevy = { version = "=0.19.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
