[workspace]
members = [
    "crates/imperialism-app",
    "crates/imperialism-core",
    "crates/imperialism-formats",
    "crates/imperialism-testkit",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
bevy = { version = "=0.19.0", default-features = false, features = [
    # Prefer official collections over hand-picking every crate, but omit
    # default_platform extras (wayland/gilrs/udev) we do not need here.
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "bevy_clipboard",
    "x11",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "picking",
    "2d_bevy_render",
    "audio",
    "bmp",
    "wav",
] }
clap = { version = "4", features = ["derive"] }
enum-map = { version = "2.7", features = ["serde"] }
pelite = { version = "0.10.0", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
