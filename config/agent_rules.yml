# Structured agent rule knowledge base — the fast, machine-selectable layer over
# AGENTS.md (invariants) and the topical skills (depth + field notes).
#
#   just advice 0xADDR    # select relevant active rules for a target
#   just advice --diff    # select rules for the current working diff
#
# Schema per rule:
#   id:         stable identifier, <AREA>-<NAME>-<NNN>; never renumber or reuse
#   status:     active | superseded (superseded rules must name a successor)
#   title:      one-line claim
#   triggers:   tags the advice engine matches (see tools/workflow/advice.py TAGS)
#   required:   what to do (imperative, short)
#   forbidden:  what must not be done
#   tools:      `just` commands that produce the evidence (never raw module runs)
#   skill:      topical skill holding the depth/field notes
#   supersedes: legacy heuristics-note ids this rule replaces (documentation only)
#   examples:   addresses proving the rule (optional)
#
# Linted by `just agent-rules-gate` (tools/workflow/check_agent_rules.py):
# duplicate ids, dangling supersedes/successor refs, active-superseded conflicts,
# required/forbidden contradictions, non-just tool commands.

rules:
  - id: ABI-THIS-001
    status: active
    title: A callee that reads ECX-relative memory is a real __thiscall method
    triggers: [callee_reads_ecx, caller_loads_ecx, ghidra_cdecl_label]
    required:
      - model_as_real_member_method_on_owning_class
      - verify_ret_n_matches_stack_args
    forbidden:
      - thiscall_function_pointer_cast
      - fastcall_dummy_edx_bridge
    tools: ["just ghidra portprep 0xADDR", "just ghidra func-sig 0xADDR", "just scan-cdecl-thiscall"]
    skill: calling-conventions
    supersedes: [legacy-note-5, legacy-note-26, legacy-note-112L]
    examples: [0x4e0460, 0x550b60, 0x4d8390]

  - id: ABI-SINGLETON-002
