format_version: 1

# Every emitted finding inherits a reviewed classification and durable owner from
# this table. The committed fingerprint baseline makes newly introduced findings
# fail the check instead of silently expanding the report.
categories:
  nested_integral_cast:
    classification: width_or_bit_pattern_boundary
    owner: imperialism-decomp-1uj.99.2
    rationale: Preserve listing-required narrowing and sign extension; remove only redundant outer promotion.
  predicate_storage_cast:
    classification: predicate_boundary
    owner: imperialism-decomp-1uj.99.7
    rationale: Distinguish bool semantics from retail char, byte, and BOOL storage or return ABI.
  raw_discriminant_literal:
    classification: enum_candidate
    owner: imperialism-decomp-1uj.99.8
    rationale: A Type, Kind, Mode, State, or Code comparison needs a domain enum or explicit boundary classification.
  native_integral_boundary:
    classification: win32_mfc_boundary
    owner: imperialism-decomp-1uj.99.9
    rationale: Keep explicit conversion where game-owned values enter a Win32 or MFC scalar ABI.

# Individually reviewed native boundaries. The audit requires this key set to match
# every native_integral_boundary fingerprint exactly, so changing an expression
# forces a fresh API/listing review instead of inheriting this approval silently.
native_integral_reviews:
  ddb6e55e5ead83ab:
    classification: win32_struct_word_field
    evidence: BITMAPINFOHEADER.biBitCount is WORD; retail 0x00479fe0 writes the low argument word to header offset 0x0e.
  90ad32c2364f4c93:
    classification: win32_struct_word_field
    evidence: LOGPALETTE.palNumEntries is WORD; retail 0x0047ae90 copies the low word of the 32-bit palette count to offset 2.
  1bedaab2dce1eddf:
    classification: win32_struct_word_field
    evidence: LOGPALETTE.palNumEntries is WORD; retail 0x0047af60 copies the low word of the 32-bit palette count to offset 2.
  17f25feb058b46da:
    classification: win32_struct_word_field
    evidence: LOGPALETTE.palNumEntries is WORD; retail 0x0047b030 copies the low word of CDib's 32-bit palette count to offset 2.
  ce86d676236a8915:
    classification: win32_struct_word_field
    evidence: LOGPALETTE.palNumEntries is WORD; retail 0x0047b1b0 copies the low word of the Win32 device palette entry count to offset 2.
  4a577257115fdf30:
    classification: win32_struct_word_field
    evidence: LOGPALETTE.palNumEntries is WORD; retail 0x0047e440 stores BX to offset 2 before CreatePalette.
  efb9327b8ccc01bd:
    classification: win32_struct_word_field
    evidence: GetObjectA yields a UINT entry count but LOGPALETTE.palNumEntries is WORD; retail 0x0047efa0 narrows only at the structure field.
  8643894c63c98a37:
    classification: mfc_bool_callback_return
    evidence: CWnd::OnSetCursor returns BOOL while Default returns LRESULT; retail 0x00483ef0 tail-returns the full Default result through the BOOL override ABI.
  b442f3eac7d1c116:
    classification: mfc_bool_callback_return
    evidence: CWnd::OnQueryNewPalette returns BOOL while Default returns LRESULT; retail 0x00493ca0 preserves the MFC callback ABI.
  c2e2852e7faabcf6:
    classification: win32_uint_sentinel
    evidence: MessageBeep takes UINT and 0xffffffff selects the simple default sound; retail wrapper 0x004931e0 pushes -1 directly.
  1c1d74f04479d145:
    classification: win32_allocation_size
    evidence: VC5 GlobalAlloc takes a DWORD byte count; retail 0x005e3d40 forwards the 32-bit packet length unchanged at the API boundary.
  fdcb8f20e3a45adb:
    classification: win32_struct_byte_field
    evidence: RGBQUAD.rgbBlue is BYTE; retail 0x005de010 copies the low packed-color byte into the four-byte local structure.
  806aaeb52fe4f325:
    classification: win32_struct_byte_field
    evidence: RGBQUAD.rgbGreen is BYTE; retail 0x005de010 extracts packed-color bits 8 through 15 into the structure.
  ed6f4dcdc439d462:
    classification: win32_struct_byte_field
    evidence: RGBQUAD.rgbRed is BYTE; retail 0x005de010 extracts packed-color bits 16 through 23 into the structure.
  ce82c4c20067c59c:
    classification: win32_struct_byte_field
    evidence: RGBQUAD.rgbReserved is BYTE; retail 0x005de010 extracts packed-color bits 24 through 31 into the structure.
  d97fbba03dae091e:
    classification: multimedia_dword_field
    evidence: MCI_PLAY_PARMS.dwFrom is DWORD; retail 0x005e1850 masks the track index to eight bits before the dword store.
  9440836a8128678f:
    classification: multimedia_dword_field
    evidence: MCI_PLAY_PARMS.dwTo is DWORD; retail 0x005e1850 increments then masks the track index before the dword store.
  c35544f8b821ac5f:
    classification: mfc_control_identifier
    evidence: CWnd::Create takes a UINT child-control identifier; TEditText::Open forwards the full 32-bit controlTag at this MFC boundary.

# Reviewed discriminant families. Every identifier a raw_discriminant_literal finding
# compares is classified here, so a new identifier fails the check until someone
# reviews it and a family that stops appearing must be removed. Owners default to
# the raw_discriminant_literal category owner.
# Reviewed predicate storage boundaries, keyed by fingerprint so an edited boundary
# must be reviewed again. Whether a predicate may become bool depends on the site's
# storage width and return ABI, not on the class; the prose record of these decisions
# (including measured-and-reverted ones) is docs/reference/bool-boundary-inventory.csv.
# Reviewed nested integral conversions, keyed by fingerprint so an edited conversion
# must be reviewed again. A two-step conversion is not redundancy by default: most
# are a required representation step (sign preservation, logical shift, packed-word
# assembly) followed by the destination's storage width. The canonical types these
# boundaries convert between are recorded in docs/reference/scalar-boundary-inventory.csv.
nested_conversion_reviews:
  8a5cc0fec966a3f8:
    classification: prng_extract_then_narrow
    evidence: "the map-generation LCG state is unsigned so the >> 0xc extraction is logical; the int step selects retail signed remainder code and the short step is the direction word consumed by the inlined neighbor lookup."
  cb4593f41b01cff8:
    classification: encoding_policy_widening
    evidence: "IMPERIALISM_FOURCC promotes each character through unsigned char before shifting so a signed char never sign-extends into the tag; the two steps are the encoding policy, not redundancy."
  ddbd994a05628784:
    classification: encoding_policy_widening
    evidence: "the same per-character promotion for byte 2 of the tag."
  08a127d9814aa2e3:
    classification: encoding_policy_widening
    evidence: "the same per-character promotion for byte 3 of the tag."
  239a01f6e5d42d4e:
    classification: encoding_policy_widening
    evidence: "the same per-character promotion for byte 4 of the tag."
  d04e53616a68e0c4:
    classification: prng_extract_then_narrow
    evidence: "the map-generation LCG state is unsigned so the >> 0xc extraction is logical; the int step keeps the modulus signed and the short step is the caller's word storage."
  5d24093db60dff4e:
    classification: prng_extract_then_narrow
    evidence: "the sibling extraction with a modulus of 100, same three-step shape."
  991e04b36a1b6e0f:
    classification: prng_extract_then_narrow
    evidence: "the same LCG extraction consumed directly as an int."
  d255e88d15a541ef:
    classification: float_table_read_then_byte_store
    evidence: "g_afTacticalDirectFireFlagByCategoryCode is a float table; the int step performs the retail truncation and the char step is the byte the caller stores."
  de75db3d85d58b05:
    classification: float_table_read_then_byte_store
    evidence: "the same float-table truncation for a second category lookup."
  824a25dd60447ccc:
    classification: float_table_read_then_byte_store
    evidence: "the same float-table truncation."
  6621fb42a8fec75a:
    classification: float_table_read_then_byte_store
    evidence: "the same float-table truncation."
  b97c45855ac1db98:
    classification: float_table_read_then_byte_store
    evidence: "the same float-table truncation."
  18cab6f36c866700:
    classification: float_table_read_then_byte_store
    evidence: "the same float-table truncation."
  65d0afcdf6299bbd:
    classification: float_table_read_then_byte_store
    evidence: "the same float-table truncation."
  6c7e30e81b08a3f7:
    classification: narrow_operand_then_narrow_result
    evidence: "CPoint::y and CRect::top are LONG, so the inner casts are real narrowings to the retail word arithmetic; the outer cast stores the row index as a short. Same-width cast names in the report describe the cast types, not the operand types."
  853f788ff413bf8c:
    classification: signed_byte_then_unsigned_byte_store
    evidence: "field8d6 holds a signed difficulty byte; the signed step preserves sign extension before the +0x33 bias and the unsigned step is the byte written into the flags array."
  f53ae4b65489ba45:
    classification: signed_byte_then_unsigned_byte_store
    evidence: "the sibling flag byte, same two-step bias."
  762276b4ea380e3b:
    classification: signed_difference_then_unsigned_use
    evidence: "the economic-turn difference is computed signed and consumed as an unsigned quantity; both steps are required to reproduce the retail compare."
  68e7a90c5513ee66:
    classification: packed_word_pair
    evidence: "the low word is isolated before being shifted into the high half of a packed 32-bit code; the int step keeps the shift signed."
  eb220da528b853bc:
    classification: unsigned_char_then_signed_compare
    evidence: "the format character is widened without sign extension, then compared as a signed count."
  caa87a07f2146dbb:
    classification: signed_grid_cell_then_word_key
    evidence: "the region-class grid stores signed bytes; the signed step preserves the -1 sentinel and the unsigned short step is the word key the neighbour tally uses."
  7fcc0893d2017e1f:
    classification: signed_grid_cell_then_word_key
    evidence: "the same signed-byte grid read for the first neighbour."
  b60ed63416b4f980:
    classification: signed_grid_cell_then_word_key
    evidence: "the same signed-byte grid read for the second neighbour."
  3f41f67892a6fd59:
    classification: signed_grid_cell_then_word_key
    evidence: "the same signed-byte grid read for the third neighbour."
  eb265394ddb5605a:
    classification: packet_word_extract
    evidence: "the trade code is shifted logically as unsigned before the high word is stored into a signed word packet field."
  070987d9276298aa:
    classification: narrow_operand_then_narrow_result
    evidence: "TView::frameHeight38 is an int, so the inner cast is a real narrowing to the retail word arithmetic."
  bd0a5d6bf28d042b:
    classification: narrow_operand_then_narrow_result
    evidence: "slotToken is an unsigned int read from the save stream, so the inner cast is a real narrowing before the *10 + 0x717 word computation."
  a4d0dcc60098301c:
    classification: word_arithmetic_then_character
    evidence: "the AI state code is biased in word arithmetic and stored as the ASCII character the debug overlay draws."
  9f9caf8fda50fb94:
    classification: prng_extract_then_narrow
    evidence: "the same LCG extraction shape as TArmyMgr, with a caller-supplied range span."
  fb4cc0429d2807ae:
    classification: signed_table_byte_then_int
    evidence: "the university requirement table stores signed bytes; the signed step preserves negative levels and the int step is the arithmetic width."
  5683b5c15d728d03:
    classification: signed_byte_sign_test
    evidence: "the packed map-tile action state byte is read signed so the retail SETGE test implements >= 0, then normalized to a byte for the retail byte compare."

predicate_storage_reviews:
  06ed593903a04495:
    classification: byte_field_storage
    evidence: "TEngineerDialog::BuildCityViewProductionControls stores the fort-availability predicate ((activeFlags1c >> 4) & 1 == 0) into a one-byte local mirroring the original's SETZ byte store; the explicit conversion preserves that byte layout and the value later gates widget construction, not a bool branch."
  290838552df4ad4a:
    classification: byte_field_storage
    evidence: "the rail-availability predicate ((activeFlags1c >> 2) & 1 == 0) stored into the sibling one-byte local, same SETZ byte-store shape."
  1a972fb69f5925f0:
    classification: byte_field_storage
    evidence: "TLoadSavePicture::loadModeFlag90 is a one-byte object field initialized from the save-format predicate; the explicit conversion preserves the recovered byte layout."
  b5fa1d97e89a5eb5:
    classification: byte_abi_argument
    evidence: "TCzechBox::SetState takes unsigned char at recovered slot 0x75; the selected-slot predicate crosses that byte ABI boundary (both byte args cast explicitly to pick the slot-0x75 overload over the visible TView::SetState(int, int))."
  ef3d88e3b5456166:
    classification: byte_abi_argument
    evidence: "TArmyCheckBox::SetState is a virtual taking `unsigned char on` at slot 0x72 (0x004aa360); the toggle passes the inverted IsOn() predicate through that byte parameter, so the conversion belongs at the ABI boundary and the parameter must not become bool."
  1b59484a1b41425a:
    classification: byte_abi_argument
    evidence: "the same slot-0x72 byte parameter, reached from ToggleIf(unsigned char expectedState, unsigned char drawImmediate)."
  d144e1a86956838b:
    classification: predicate_arithmetic_into_byte_return
    evidence: "the value is not a predicate: the comparison result is an addend (`(0x0f < capacity) + 3`) producing building tier 3 or 4, narrowed once at the char return. bool would force an extra normalization and lose the arithmetic shape."
  853e86ea99ed7cf3:
    classification: predicate_arithmetic_into_byte_return
    evidence: "the sibling tier computation `(0x1f < capacity) + 3` on the next capacity band, with the same char return."
  d525f39e47be4ea5:
    classification: byte_abi_argument
    evidence: "TCzechBox::SetState is a virtual taking `unsigned char isOn` at slot 0x75 (0x00571e00); same byte ABI as the TArmyCheckBox family."
  65f76dbb872a689f:
    classification: byte_abi_argument
    evidence: "the same slot-0x75 byte parameter, reached from ToggleIf(unsigned char expectedState, unsigned char refreshNow)."
  b441b8502f10ecf2:
    classification: predicate_arithmetic_into_byte_storage
    evidence: "`(town->enabledFlag4d != 0) + 1` yields influence weight 1 or 2 written into the byte influence map; the comparison is an addend, not a logical value."
  f25ec5fb631b91f5:
    classification: byte_return_abi
    evidence: "the enclosing affordability query returns char and its callers consume AL; converting the local alone would only move the normalization."
  40aca8b0eb14fbab:
    classification: byte_return_abi
    evidence: "the sibling affordability query with the same char return contract."
  2d4eed00b9f919c8:
    classification: byte_field_storage
    evidence: "the value is stored into TRadioText::isSelectedOption98, a one-byte object field the retail code compares directly (cmp al,cl) with no `!= 0` normalization; the cast keeps the store byte-wide."
  1f0f5b126e19f37e:
    classification: byte_comparison_of_packed_state
    evidence: "the second operand of the same byte compare -- the sign test on the packed map-tile action state byte."

