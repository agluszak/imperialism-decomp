  setupMode:
    classification: closed_domain_needs_listing_evidence
    evidence: TSimMgr dispatches four game-setup paths 1..4; the four entry points are known but their retail names are not.
  sfxCode:
    classification: open_index_count_or_bound
    evidence: TCivMgr tests for a non-zero sound-effect id before playing it.
  taskKind:
    classification: closed_domain_needs_listing_evidence
    evidence: TCity distinguishes task kind 1 from the rest; the task-kind table is not recovered.
  terrainCode:
    classification: nation_slot_domain
    evidence: TMacViewMgr reads terrainStateTable[].ownerNationTag04 and bounds it by the 23-entry nation domain; despite the name this is not terrain.
  terrainType:
    classification: tactical_terrain_kind_domain
