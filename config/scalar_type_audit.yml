    evidence: TUnitOrder::resourceTypeIndex48 takes 0, 1, 5, 6, 8 and 0x0f across TTrainingOrder, TExpansionOrder, TShipOrder, TCapacityOrder and TTechMgr; 0x0f exceeds the 14-entry industry domain and no listing yet proves the extent, so the slot stays explicitly unresolved rather than being forced into ResourceKind.
  ringState:
    classification: closed_domain_needs_listing_evidence
    evidence: TMapMaker walks a three-state coastline ring scanner (0/1/2) against kStrategicTerrainWater; the states are a local scan phase, nameable once the ring walk is described.
  saveMode:
    classification: external_api_or_resource_constant
    evidence: TLoadSavePicture 0xa1 is a save-file format marker, not a mode enum.
  screenModeAt24:
    classification: closed_domain_needs_listing_evidence
    evidence: four call sites band a shared screen mode at 1 and 2 across TLoadSavePicture, TToolBarCluster, TUnitToolbarCluster and TWorldView; the mode owner has not been attributed.
  secondaryMetricCode:
