format_version: 1

# Source-observed boot/new-random-game route.  The generated report validates
# that each stage has a factory or an intentional internal dispatch path.
boot_path:
  0x11f8: {stage: title_movie, gap_bead: imperialism-decomp-1uj.57}
  0x05dc: {stage: main_menu, gap_bead: imperialism-decomp-1uj.57}
  0x03b8: {stage: random_game_setup, gap_bead: imperialism-decomp-1uj.57}
  0x03c0: {stage: random_map_setup, gap_bead: imperialism-decomp-1uj.57}
  0x05e4: {stage: game_session_transition, gap_bead: imperialism-decomp-1uj.57}
  0x07dd: {stage: strategic_map, gap_bead: imperialism-decomp-1uj.57}

screen_names:
  0x0000: rebuild_registered_windows
  0x0547: diplomacy_offer
  0x05dc: main_menu
  0x07d8: diplomacy_map
  0x07d9: trade_overview
  0x07da: industry_overview
  0x07db: city_production
  0x07dd: strategic_map
  0x07de: transport
  0x11f8: title_movie
  0x2103: newspaper_status
  0x2260: deal_book

gap_owners: {}

# Codes that reach the view-factory resolver but are provably not view codes.
# Each entry replaces the `posted_missing_builder` classification with an
# explicit, evidence-backed disposition; the evidence must name the addresses it
# rests on.  Do not add an entry here to silence an unexplained gap -- absence of
# a factory case alone is NOT evidence (many working screens, e.g. the Minister
# books 0x22e2..0x25f8, are built through other dispatch paths entirely).
non_factory_dispositions:
  0x03c5:
    status: windows_alternate_path
    summary: county-seat placement resolves and configures the dialog directly
    evidence: >-
      TMapEditView::PlaceCountySeat 0x0051dc90 receives event 0x03c5 and calls
      TAssetMgr::ResolveTurnEventDialogNodeByMessageContext directly; retail builder
      0x004538a0 has no 0x03c5 case.
  0x07e5:
    status: windows_alternate_path
    summary: gold-dialog refresh resolves and opens the dialog directly
    evidence: >-
      TViewMgr::HandleTurnEventVtableSlot40RefreshGoldDialog 0x005d57b0 receives event
      0x07e5, calls TAssetMgr resolver slot 0x28, and configures and opens the returned
      dialog; retail builder 0x004357b0 has no 0x07e5 case.
  0x0f3d:
    status: windows_alternate_path
    summary: unit-history dispatch uses the dedicated Windows screen path
    evidence: >-
      TViewMgr::DispatchTurnEvent 0x005d7240 handles event 0x0f3d explicitly through
      TViewMgr::ShowUnitHistory; retail builder 0x0046fd10 has no 0x0f3d case.
  0x22e2:
    status: excluded_unreachable_controller
    summary: foreign-minister recommendation book survives only in dead shelf code
    evidence: >-
      The sole sender is TForeignMinisterView::HandleEvent 0x004f3050;
      TForeignMinisterView constructor 0x004f2fd0 has no callers and its vtable is
      written only by the constructor and CreateObject.
  0x22ec:
    status: excluded_unreachable_controller
    summary: merchant-marine book survives only in dead foreign-minister shelf code
    evidence: >-
      The sole sender is TForeignMinisterView::HandleEvent 0x004f3050;
