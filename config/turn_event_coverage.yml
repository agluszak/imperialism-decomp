  0x25f8:
    status: excluded_unreachable_controller
    summary: treasuries book survives only in dead interior-minister shelf code
    evidence: >-
      The sole sender is TInteriorMinisterView::HandleEvent 0x004f3710;
      TInteriorMinisterView constructor 0x004f3690 has no callers and its vtable is
